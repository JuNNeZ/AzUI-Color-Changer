\r
1. Identify the affected subsystem and protected or secret-data boundary.\r
2. Read the existing implementation and relevant TOC entries.\r
3. Verify APIs with Hated WoW MCP or `wow-api`; inspect Blizzard FrameXML when implementation behavior matters.\r
