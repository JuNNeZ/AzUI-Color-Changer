name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luacheck

      - name: Accidental globals (luacheck)
        run: luacheck .

      - name: Accidental globals (the local check, so it stays in step with luacheck)
        run: lua5.1 Tools/CheckGlobals.lua

      - name: Hunter stable on Retail and Forever
        run: lua5.1 Tools/TestClients.lua

      - name: ABCS window, Studio theme
        run: lua5.1 Tools/TestPanel.lua

      - name: ABCS window, Azerite theme with AzeriteUI art
        run: lua5.1 Tools/TestPanel.lua art

      - name: ABCS window, Azerite theme with Blizzard art
        run: lua5.1 Tools/TestPanel.lua plain

      - name: ABCS window, Azerite theme with stock AzeriteUI 5.x
        run: lua5.1 Tools/TestPanel.lua stock

      - name: ABCS window, Azerite theme with AzeriteUI6
        run: lua5.1 Tools/TestPanel.lua aui6

      - name: 5.1 and 5.2 features
        run: lua5.1 Tools/TestFeatures.lua

      - name: ABCS Studio pages
        run: lua5.1 Tools/TestStudio.lua

      - name: Unit frame addons, overlays, gradient and /ahui check
        run: lua5.1 Tools/TestFrames.lua

      - name: Rule conditions, threat and casting, sounds, rules on every bar, presets per specialization
        run: lua5.1 Tools/TestRules.lua

      - name: Repainting, frame scans, buff events, effects and pets long gone
        run: lua5.1 Tools/TestEngine.lua

      - name: Sharing a setup through a link in chat
        run: lua5.1 Tools/TestChat.lua

      - name: Translations
        run: lua5.1 Tools/TestLocales.lua
